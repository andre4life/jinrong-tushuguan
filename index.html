任何不爽的人事物说“不”的独立财富底气 | **【存够了足够花一辈子的安全现金流，老板再刁难随时甩工牌走人】** | 人生财富自由的终极意义 |\n| **100**| **三师共诊金三角** | 财富顾问（理财师）+ 专业律师 + 税务专家 | **【高家帮法律服务天团：左手抓收益、右手筑防线、头顶合规天，护航基业长青】** | 现代财富管理团队赋能巅峰 |\n"}, {"filename": "02_全球金融量化指标与估值模型全景大百科.md", "title": "02 全球金融量化指标与估值模型全景大百科", "path": "07_金融素养与核心词典馆/02_全球金融量化指标与估值模型全景大百科.md", "content": "# 02 全球金融量化指标与估值模型全景大百科\n\n> **导言**：金融与投资的本质是用数学语言对不确定性与资产价值进行度量。本篇文献系统梳理宏观流动性、股票与指数估值、企业财务质量、基金与投资组合风控、固定收益债券、人身保险与养老精算等 **六大领域、60+ 项核心量化指标与数学模型**，配备精确数学公式、大白话生活类比、量化阈值标准与实战避坑指南。\n\n---\n\n## 🏛️ 六大金融量化指标体系全景图\n\n```\n                           【全球金融量化指标大百科】\n                                       │\n     ┌──────────────────┬──────────────┼──────────────┬──────────────────┐\n     ▼                  ▼              ▼              ▼                  ▼\n【一、宏观流动性】  【二、股票与指数估值】 【三、企业财务质量】 【四、组合风控绩效】 【五、固收与保险精算】\n ├─ M1/M2剪刀差      ├─ PE(静态/动态/TTM) ├─ ROE (杜邦拆解)   ├─ CAGR 复合年化   ├─ YTM 到期收益率\n ├─ 社融存量增速      ├─ PB 市净率/破净率  ├─ ROIC 资本回报率  ├─ 年化波动率 σ    ├─ 麦考利/修正久期\n ├─ CPI / PPI 剪刀差 ├─ PS 市销率         ├─ 毛利率 / 净利率   ├─ 最大回撤 MaxDD  ├─ 凸性 Convexity\n ├─ 泰勒法则利率      ├─ PEG 成长估值比    ├─ 资产负债率       ├─ 夏普比率 Sharpe ├─ 信用利差 / 期限利差\n ├─ 10年期国债收益率 ├─ EV/EBITDA 企业倍数 ├─ 流动/速动比率    ├─ 索提诺比率 Sortino ├─ IRR / XIRR 复利\n ├─ 美债收益率倒挂    ├─ 股息率 Dividend   ├─ 经营现金流净额   ├─ 卡玛比率 Calmar ├─ 单利等效年化\n ├─ 美元指数 DXY      ├─ 股债利差 ERP      ├─ 自由现金流 FCF   ├─ 贝塔 Beta / Alpha ├─ 分红实现率 Fulfillment\n └─ 宏观杠杆率        └─ 席勒CAPE / 破净率 └─ 营运周期与周转率 └─ 72法则 / 信息比率 └─ 综合偿付能力充足率\n```\n\n---\n\n## 一、宏观经济与流动性量化指标库\n\n### 1.1 货币与信用流动性指标\n\n| 指标名称 | 英文/符号 | 计算公式 / 构造定义 | 生活化大白话比喻 | 典型阈值与周期含义 |\n| :--- | :--- | :--- | :--- | :--- |\n| **M1-M2 剪刀差** | $M1 - M2$ Growth Gap | $\\Delta M1\\% - \\Delta M2\\%$ | **“钱包里的零钱” vs “死期存单”的增速对比**。钱包零钱多说明准备随时花钱投资，死期存单多说明躺平观望。 | **正值扩张**：经济活跃、牛市初期；<br>**负值扩大**：流动性陷阱、资金沉淀定期。 |\n| **社会融资规模存量增速** | TSF YoY | $\frac{TSF_t - TSF_{t-1}}{TSF_{t-1}} \times 100\\%$ | **实体经济的“输血总量”**。银行贷款、发债、股票融资等实体拿到手的资金总盘子。 | **> 10%**：宽信用、经济扩张期；<br>**< 8%**：信用收缩、去杠杆。 |\n| **CPI-PPI 剪刀差** | CPI - PPI | $CPI\\% - PPI\\%$ | **“终端零售卖价”与“工厂出厂进价”的差额**。反映工业上游向下游中下游传导利润的顺畅度。 | **扩大正值**：中下游消费与制造业利润修复；<br>**负值倒挂**：上游大宗涨价挤压下游利润。 |\n| **泰勒法则目标利率** | Taylor Rule Rate | $r^* + \\pi + 0.5(\\pi - \\pi^*) + 0.5(y - y^*)$ | **央行调控利率的“自动温度计”**。根据通胀和GDP缺口自动算出的最佳基准利率。 | 用于预判美联储与央行降息/加息终点利率区间。 |\n\n### 1.2 利率、汇率与宏观杠杆指标\n\n| 指标名称 | 英文/符号 | 计算公式 / 构造定义 | 生活化大白话比喻 | 典型阈值与周期含义 |\n| :--- | :--- | :--- | :--- | :--- |\n| **10年期国债收益率** | 10Y Sovereign Yield | 无风险国债二级市场到期收益率 | **整个金融世界的“地心引力”**。一切资产定价的无风险锚。 | **< 2.0%**：资产荒、资金极度追求确定性；<br>**> 3.5%**：经济高热、紧缩预期。 |\n| **美债收益率曲线倒挂** | 10Y-2Y Spread | $Yield_{10Y} - Yield_{2Y}$ | **“借10年长期借款的利息竟然比借2年还便宜”**，市场极度悲观、提前预期降息。 | **利差 < 0（倒挂）**：历史上 12-18 个月内爆发经济衰退的胜率超过 90%。 |\n| **美元指数** | DXY | 6种主要货币加权几何平均值 | **全球资金的“水龙头与磁铁”**。美元走强意味着全球流动性向美国回流。 | **> 105**：全球非美资产承压，新兴市场汇率承压；<br>**< 95**：全球流动性宽松，大宗商品大涨。 |\n| **宏观杠杆率** | Macro Leverage | $\frac{\text{实体经济部门总债务}}{\text{名义 GDP}} \times 100\\%$ | **一个家庭/国家的总借款与年收入的比例**。借钱拉动增长的极限天花板。 | **居民杠杆率 > 65%**：居民消费与房贷承压；<br>**总杠杆率 > 280%**：必须转向高质量防风险。 |\n\n---\n\n## 二、股票、宽基指数与估值模型核心指标库\n\n### 2.1 估值乘数指标 (Valuation Multiples)\n\n| 指标名称 | 计算公式 | 衡量本质 | 生活化买菜比喻 | 估值安全区间与应用 |\n| :--- | :--- | :--- | :--- | :--- |\n| **市盈率 (PE-TTM)** | $PE = \frac{\text{总市值}}{\text{过去12个月净利润}}$ | 回本年限 | **买下整个菜摊，靠过去一年的净赚利润，多少年能彻底回本。** | **< 10倍**：低估黄金坑；<br>**10-20倍**：合理区间；<br>**> 35倍**：偏高或透支成长。 |\n| **市净率 (PB)** | $PB = \frac{\text{总市值}}{\text{企业净资产 (账面价值)}}$ | 物理资产折溢价 | **菜摊所有的秤、冰箱、三轮车砸锅卖铁值10万，现在花多少钱买这个壳。** | **PB < 1（破净）**：极度悲观或破产重组清算价；银行/重资产估值核心。 |\n| **市销率 (PS)** | $PS = \frac{\text{总市值}}{\text{年营业总收入}}$ | 销售规模估值 | **不看赚不赚钱，看这个菜摊一年能流水卖出多少万的菜。** | 适用尚未盈利的高成长科技公司、生物医药初创企业。 |\n| **市盈增长比 (PEG)** | $PEG = \frac{PE}{\text{净利润复合增长率 } G \times 100}$ | 成长性与价格匹配 | **为菜摊未来每年多赚20%的成长能力，付出多少倍的溢价。** | **PEG < 0.8**：严重低估（彼得·林奇最爱）；<br>**PEG = 1.0**：合理匹配；<br>**PEG > 1.5**：透支成长。 |\n| **企业价值倍数 (EV/EBITDA)** | $\frac{\text{市值} + \text{净有息负债}}{\text{息税折旧摊销前利润}}$ | 全资本回报估值 | **扣除买菜摊借的钱、税收和折旧，买下整个生意实际现金流倍数。** | 消除不同企业资本结构、税率和折旧政策差异，跨国并购核心指标。 |\n\n### 2.2 股息、红利与大势研判指标\n\n| 指标名称 | 计算公式 | 衡量本质 | 判定标准与分位数法则 |\n| :--- | :--- | :--- | :--- |\n| **股息率 (Dividend Yield)** | $D = \frac{\text{每股现金分红}}{\text{当前股票价格}} \times 100\\%$ | 每年真金白银现金回报率 | **> 4.5%**：超越国债与理财，红利防御属性极强；<br>**< 1.5%**：成长股或高估值状态。 |\n| **股权风险溢价 (ERP / 股债利差)** | $ERP = \frac{1}{PE} - \text{10年期国债收益率}$ | 股票相对于国债的性价比溢价 | **> 4.0%（极度高估股票性价比）**：大举逆向加仓股票/指数；<br>**< 1.5%（股票极度昂贵）**：减仓股票，切换至确定性年金/国债。 |\n| **席勒市盈率 (CAPE)** | $CAPE = \frac{\text{实际股价}}{\text{过去10年通胀调整平均净利润}}$ | 剔除经济周期波动真实估值 | 消除单一年份周期暴赚/暴亏扰动，标普500长期估值中枢约 16-18 倍。 |\n| **巴菲特指标 (Buffett Indicator)** | $\frac{\text{股票市场总市值}}{\text{国家国民生产总值 GNP (或 GDP)}} \times 100\\%$ | 股市与实体经济规模偏离度 | **< 75%**：股市整体严重低估；<br>**90% - 115%**：合理中枢；<br>**> 140%**：全市场严重泡沫化。 |\n| **破净率 (P/B < 1 Ratio)** | $\frac{\text{破净股票数量}}{\text{全市场上市股票总数}} \times 100\\%$ | 市场恐慌与底部极值 | **A股破净率 > 12%-15%**：历史上无一例外均为历史大底（如2005、2008、2014、2024）。 |\n\n---\n\n## 三、企业盈利能力与资产负债质量指标库\n\n### 3.1 盈利能力与杜邦分析体系 (DuPont Analysis)\n\n```\n                       【杜邦三因子拆解公式】\n           ROE = 销售净利率 × 资产周转率 × 权益乘数\n                  │              │           │\n              (赚不赚钱)      (转得快不快)  (杠杆大不大)\n```\n\n| 指标名称 | 计算公式 | 核心作用与商业模式映射 |\n| :--- | :--- | :--- |\n| **净资产收益率 (ROE)** | $ROE = \frac{\text{净利润}}{\text{平均净资产}} \times 100\\%$ | **巴菲特最看重的单一大指标**。股东每投入100块钱本金，一年能净赚多少钱。持续 ROE > 15% 为顶级商业模式。 |\n| **销售净利率 (Net Margin)** | $\frac{\text{净利润}}{\text{营业收入}} \times 100\\%$ | 产品的护城河与定价权（如茅台净利率 > 50%，走高利润路线）。 |\n| **总资产周转率 (Asset Turnover)** | $\frac{\text{营业收入}}{\text{平均总资产}}$ | 资产运营效率（如 Costco、沃尔玛薄利多销，周转极快）。 |\n| **权益乘数 / 财务杠杆 (Equity Multiplier)** | $\frac{\text{总资产}}{\text{净资产}} = \frac{1}{1 - \text{资产负债率}}$ | 借鸡生蛋的杠杆放大倍数（如银行、房地产杠杆极高）。 |\n| **投入资本回报率 (ROIC)** | $ROIC = \frac{\text{息前税后利润 } EBIT(1-t)}{\text{有息负债} + \text{所有者权益}}$ | 剔除财务杠杆修饰后，企业主营业务真实的造血与资本利用能力。 |\n\n### 3.2 偿债能力与现金流健康指标\n\n| 指标名称 | 计算公式 | 危险警界线 | 正常健康标准 |\n| :--- | :--- | :--- | :--- |\n| **资产负债率 (Debt Ratio)** | $\frac{\text{总负债}}{\text{总资产}} \times 100\\%$ | **制造业 > 70%**（偿债压力巨大） | 40% - 60% 稳健适中 |\n| **流动比率 (Current Ratio)** | $\frac{\text{流动资产}}{\text{流动负债}}$ | **< 1.0**（短期借款可能违约） | 1.5 - 2.0 充裕安全 |\n| **速动比率 (Quick Ratio)** | $\frac{\text{流动资产} - \text{存货} - \text{预付账款}}{\text{流动负债}}$ | **< 0.7**（变现困难） | 1.0 左右及格 |\n| **自由现金流 (FCF)** | 经营性现金流净额 - 资本性支出 (CapEx) | **连续多年为负**（失血烧钱模式） | 持续正向流入且高于净利润 |\n| **净利润现金含量** | $\frac{\text{经营活动产生的现金流量净额}}{\text{净利润}} \times 100\\%$ | **< 80%**（多为应收账款白条利润） | **> 100%**（真金白银现金到账） |\n\n---\n\n## 四、基金与投资组合风险收益绩效指标库\n\n### 4.1 收益与波动指标\n\n| 指标名称 | 计算公式 | 衡量本质 | 实战应用场景 |\n| :--- | :--- | :--- | :--- |\n| **年化复合增长率 (CAGR)** | $CAGR = \\left(\frac{V_{end}}{V_{start}}\night)^{\frac{1}{n}} - 1$ | 消除单年暴赚暴亏后，资产几何平均的真实复利航速。 | 比较不同持有年限（如标普500 20年 vs 沪深300 20年）的客观标准。 |\n| **年化波动率 (Volatility, $\\sigma$)** | $\\sigma = \\sqrt{\frac{1}{N-1}\\sum_{i=1}^N (R_i - \bar{R})^2} \times \\sqrt{252}$ | 资产价格剧烈上下颠簸的剧烈程度。 | 衡量持有人的心理舒适度与回撤概率。 |\n| **最大回撤 (Max Drawdown, MaxDD)** | $\\max_{t_1 \\le t_2} \\left(\frac{V_{t_1} - V_{t_2}}{V_{t_1}}\night) \times 100\\%$ | **从历史最高峰跌到谷底的最惨烈亏损幅度**。 | 检验投资者在最绝望时能否坚持住定投不割肉。 |\n| **72 法则 (Rule of 72)** | $\text{本金翻倍所需年数} \u0007pprox \frac{72}{\text{年化收益率 } r\\%}$ | 快速心算复利资产翻番周期的极简数学定理。 | $r=6\\%$ 时需 12 年翻倍；$r=3\\%$ 时需 24 年翻倍。 |\n\n### 4.2 风险调整后收益指标 (Risk-Adjusted Return)\n\n| 指标名称 | 计算公式 | 核心逻辑 | 评判标准 |\n| :--- | :--- | :--- | :--- |\n| **夏普比率 (Sharpe Ratio)** | $Sharpe = \frac{R_p - R_f}{\\sigma_p}$ | **每承担 1 份总波动风险，能换来多少超额收益。** | **> 1.0**：优质资产组合；<br>**> 1.5**：顶级神级基金；<br>**< 0.5**：承担巨额波动收益平庸。 |\n| **索提诺比率 (Sortino Ratio)** | $Sortino = \frac{R_p - R_f}{\\sigma_{down}}$ | 只惩罚**向下亏钱的波动**，不惩罚向上赚钱的涨幅。 | 衡量单边下跌风险的最佳指标。 |\n| **卡玛比率 (Calmar Ratio)** | $Calmar = \frac{CAGR}{|MaxDD|}$ | **年化复合收益率与历史最大回撤的比值**。 | **> 1.0**：每年赚的钱大于最惨时跌的钱，固收+极品。 |\n| **贝塔系数 (Beta, $\beta$)** | $\beta = \frac{Cov(R_p, R_m)}{Var(R_m)}$ | 资产相对大盘基准波动的敏感度倍数。 | **$\beta = 1.2$**：大盘涨10%它涨12%，大盘跌10%它跌12%。 |\n| **阿尔法系数 (Alpha, $\u0007lpha$)** | $\u0007lpha = R_p - [R_f + \beta(R_m - R_f)]$ | 脱离大盘波动之后，基金经理纯靠个人能力赚到的超额Alpha。 | $\u0007lpha > 0$ 说明存在超额管理能力。 |\n| **信息比率 (Information Ratio, IR)** | $IR = \frac{R_p - R_b}{\text{跟踪误差 Tracking Error}}$ | 承担相对基准的主动风险所换来的超额收益稳定性。 | 衡量指数增强型基金经理专业水平的试金石。 |\n\n---\n\n## 五、固定收益与债券市场量化指标库\n\n| 指标名称 | 计算公式 / 核心定义 | 物理意义与生活化买菜比喻 | 利率敏感度与风险特征 |\n| :--- | :--- | :--- | :--- |\n| **到期收益率 (YTM)** | $P = \\sum_{t=1}^n \frac{C}{(1+YTM)^t} + \frac{M}{(1+YTM)^n}$ | 持有该债券直至到期能够获得的所有现金流折现内含报酬率。 | 债券市场最真实的“年化全收益”。 |\n| **麦考利久期 (Macaulay Duration)** | $D_{mac} = \frac{\\sum_{t=1}^n \frac{t \\cdot C_t}{(1+y)^t}}{P}$ | **债券所有现金流还本付息的“加权平均回本时间（年）”**。 | 现金流回收越早，久期越短，抗利率波动越强。 |\n| **修正久期 (Modified Duration)** | $D_{mod} = \frac{D_{mac}}{1 + y/k}$ | **利率每波动 1%，债券价格大约反向变动百分之几。** | 修正久期为 8 年的债券，利率上行 1%，价格直接下跌约 8%。 |\n| **凸性 (Convexity)** | $C = \frac{1}{P \\cdot (1+y)^2} \\sum \frac{t(t+1)C_t}{(1+y)^t}$ | 债券价格与利率曲线的弯曲程度。 | **“涨多跌少”的加速器**：凸性越大，利率下降时涨得更多，利率上升时跌得更少。 |\n| **信用利差 (Credit Spread)** | $Spread = Yield_{Corporate} - Yield_{Treasury}$ | 企业债收益率与同期限无风险国债收益率的利差。 | 反映市场对违约风险的担忧程度，经济下行期利差往往剧烈拉大。 |\n| **期限利差 (Term Spread)** | $Spread = Yield_{30Y} - Yield_{10Y}$ | 超长期国债与中长期国债的利差空间。 | 反映机构对超远期经济通胀与利率再投资风险的补偿要求。 |\n\n---\n\n## 六、保险金融、精算年金与长寿风险指标库\n\n| 指标名称 | 数学公式 / 定义 | 商业本质与通俗解释 | 决策标准与行业铁律 |\n| :--- | :--- | :--- | :--- |\n| **内部收益率 (IRR / XIRR)** | $\\sum_{t=0}^n \frac{CF_t}{(1+IRR)^t} = 0$ | **剔除时间价值后，长期现金流资产真实的复利年化收益率。** | 年金与增额寿的核心验真工具，写入合同的确定性复利锁定终身。 |\n| **单利等效年化收益率** | $R_{simple} = \frac{\text{累计领回总金额} - \text{总缴保费}}{\text{总缴保费} \times \text{持有年数}} \times 100\\%$ | 将复利增值折算为普通老百姓习惯理解的“银行单利存款年化”。 | 复利 2.5% 持有 40 年等效单利可超过 **5.8% - 6.5%**。 |\n| **分红实现率 (Fulfillment Ratio)** | $\frac{\text{实际派发非保证红利总额}}{\text{销售计划书演示非保证红利总额}} \times 100\\%$ | **保险公司承诺兑现度**。检验分红险演示利益是否画大饼。 | **> 100%**：超额兑现；<br>**80%-100%**：正常波动区间；<br>**< 50%**：兑现度较差。 |\n| **综合偿付能力充足率** | $\frac{\text{实际资本}}{\text{最低资本}} \times 100\\%$ | 保险公司在极端巨灾或金融海啸下，履行所有保单赔付与现金价值给付的能力。 | **监管红线 > 100%**，平安人寿常年保持在 **180% - 220%** 极高安全垫。 |\n| **核心偿付能力充足率** | $\frac{\text{核心资本 (高质量真金白银)}}{\text{最低资本}} \times 100\\%$ | 扣除次级债等低质量资本后，保险公司的绝对抗风险硬实力。 | **监管红线 > 50%**，行业头部优等生常年保持 **100% - 140%**。 |\n| **精算三差贡献率** | $\text{死差} + \text{利差} + \text{费差}$ | 寿险公司盈利的三大底层源泉：实际死亡率低于假设、投资收益高于预定利率、运营费用低于预定费用。 | 头部大型保险公司依靠庞大体量拥有强大的“死差益”与“费差益”护城河。 |\n| **养老金替代率 (Pension Replacement Rate)** | $\frac{\text{退休后每月总养老金收入}}{\text{退休前每月工资收入}} \times 100\\%$ | 退休后生活水平是否发生断崖式暴跌的量化指标。 | **国际警戒线 50%**（低于50%生活品质严重下降）；理想目标为 **70% - 80%**。 |\n| **保障杠杆比率 (Leverage Ratio)** | $\frac{\text{最高保额 (寿险/重疾)}}{\text{首期或总缴保费}}$ | 杠杆账户以小博大的风险转嫁效率。 | 年轻人定期寿险杠杆可达 **50 - 100 倍**，高净值终身寿杠杆约 **3 - 8 倍**。 |\n\n---\n\n## 📊 七、量化指标综合速查与交叉比对决策矩阵\n\n```\n【市场当前处于什么位置？四大核心量化指标联合研判法则】\n\n   ┌───────────────────────┬────────────────────────────────────────────────────────┐\n   │ 核心量化指标组合      │ 市场当前所处周期与推荐配置策略                         │\n   ├───────────────────────┼────────────────────────────────────────────────────────┤\n   │ 1. ERP 股债利差 > 4.5%│ 🔥【历史极度黄金底】                                  │\n   │ 2. 破净率 > 12%       │ 策略：大举逆周期定投宽基指数（沪深300、标普500），       │\n   │ 3. 股息率 > 10Y国债   │       锁定超低估值优质权益资产。                       │\n   │ 4. M1-M2 负剪刀差收窄 │                                                        │\n   ├───────────────────────┼────────────────────────────────────────────────────────┤\n   │ 1. ERP 股债利差 < 1.5%│ ⚠️【高位泡沫过热期】                                  │\n   │ 2. 巴菲特指标 > 130%  │ 策略：执行动态再平衡，止盈权益资产，大举加仓锁定终身    │\n   │ 3. 破净率 < 2%        │       确定性现金流的【养老年金险 / 增额寿 / 长期国债】。│\n   │ 4. 股息率 < 1.5%      │                                                        │\n   └───────────────────────┴────────────────────────────────────────────────────────┘\n```\n"}, {"filename": "02_金融高频公式与速查手册.md", "title": "02 金融高频公式与速查手册", "path": "07_金融素养与核心词典馆/02_金融高频公式与速查手册.md", "content": "# 02 金融高频公式与速查手册\n\n## 1. 核心投资与收益类公式速查\n\n| 公式名称 | 数学表达式 | 中文释义与参数说明 | Excel / 实操计算方法 |\n| :--- | :--- | :--- | :--- |\n| **内部收益率 (IRR)** | $\\sum_{t=0}^n \\frac{C_t}{(1 + IRR)^t} = 0$ | 使未来所有净现金流现值之和等于零的折现率（真实复利） | \\`=IRR(values)\\` 或考虑日期的 \\`=XIRR(values, dates)\\` |\n| **净现值 (NPV)** | $NPV = \\sum_{t=0}^n \\frac{C_t}{(1 + r)^t}$ | 将未来所有现金流入流出按折现率 $r$ 折算到当下的净价值 | \\`=NPV(rate, value1, value2...)\\` |\n| **复合年均增长率 (CAGR)** | $CAGR = \\left(\\frac{V_{\\text{end}}}{V_{\\text{begin}}}\\right)^{\\frac{1}{n}} - 1$ | 投资在 $n$ 年间几何平均的每年复合增长率 | \\`=(Vend/Vbegin)^(1/n) - 1\\` |\n| **72法则 (Rule of 72)** | $\\text{翻倍年数} \\approx \\frac{72}{\\text{年化复利率 (\\%)}}$ | 口算本金在固定复利率下翻一番所需的近似年数 | 例：年化 3% 复利，约需 $72 / 3 = 24$ 年翻倍 |\n| **夏普比率 (Sharpe Ratio)** | $S = \\frac{E(R_p) - R_f}{\\sigma_p}$ | 组合预期超额收益除以组合标准差（波动风险） | 超额收益 / 波动率，衡量性价比 |\n\n---\n\n## 2. 宏观与估值核心公式\n\n- **市盈率 (PE)**：$PE = \\frac{\\text{股价 } P}{\\text{每股收益 } EPS} = \\frac{\\text{总市值}}{\\text{净利润}}$\n- **市净率 (PB)**：$PB = \\frac{\\text{股价 } P}{\\text{每股净资产 } BVPS} = \\frac{\\text{总市值}}{\\text{净资产}}$\n- **格雷厄姆股债利差**：$\\text{Equity Risk Premium} = \\frac{1}{PE} - \\text{10年期国债收益率}$\n- **实际利率费雪方程式**：$r_{\\text{实际}} \\approx r_{\\text{名义}} - i_{\\text{通胀率}}$\n\n---\n\n## 3. 保险精算与传承测算公式\n\n- **分红实现率**：$\\text{实现率} = \\frac{\\text{实际派发红利总额}}{\\text{计划书演示红利总额}} \\times 100\\%$\n- **退休金缺口**：$\\text{总缺口} = \\text{期望年开销} \\times (1+g)^N \\times T - (\\text{预期社保养老金总和})$\n"}, {"filename": "03_金融陷阱识别与理财防坑指南.md", "title": "03 金融陷阱识别与理财防坑指南", "path": "07_金融素养与核心词典馆/03_金融陷阱识别与理财防坑指南.md", "content": "# 03 金融陷阱识别与理财防坑指南\n\n## 1. 庞氏骗局（Ponzi Scheme）识别模型\n\n任何金融骗局无论包装成“区块链、高新农业、元宇宙、原始股还是碳中和”，其底层数学模型均符合庞氏特征：\n\n```\n【庞氏骗局三大致命死穴】\n1. 承诺远超常识的“保本无风险超高收益”（如年化 12%-36%，按月按日付息）\n2. 缺乏真实的底层生产力资产与盈利造血能力（钱进去了没有实际经营闭环）\n3. 靠拉人头发展下线拿提成，用后来人的本金填前面人的利息（一旦新韭菜枯竭瞬间崩盘）\n```\n\n---\n\n## 2. 常见金融理财陷阱全景避雷清单\n\n| 陷阱类型 | 典型包装手法 | 致命破绽与真相 | 防御与自保铁律 |\n| :--- | :--- | :--- | :--- |\n| **高息非法集资** | “政企合作、养老山庄、特许加盟、保本年化15%” | 无任何国家金融牌照，资金进入私人或皮包公司账户 | **收益率超过6%就要打问号，超过8%很危险，10%以上准备损失全部本金（银保监会警示）** |\n| **虚假原始股骗局** | “即将纳斯达克/香港上市，限时认购原始股享百倍暴利” | 股权代持、无法律确权、非上市公司股权流动性基本为零 | 未经证监会核准公开发行的“原始股”绝大多数是空气骗局 |\n| **黄金资产托管** | “买金条免费放金店托管，每月领固定高额利息” | 金店暗中将客户黄金挪用做高杠杆投机，一旦亏损卷款跑路 | 买黄金必须真金白银拿回家或存入银行保险箱/正规黄金ETF |\n| **杀猪盘 / 炒币群** | “导师带单、内幕消息、高杠杆合约带你翻倍” | 假平台后台随意操纵K线，充值容易提现永远“流水不足” | 坚决不进任何荐股带单群，不下载非正规应用商店APP |\n\n---\n\n## 3. 终身理财避坑五大黄金铁律\n1. **看牌照**：资金只流向持有中国央行、国家金融监管总局、证监会正规金融牌照的机构。\n2. **懂逻辑**：看不懂底层怎么赚钱的产品，一个字都不要碰。\n3. **查流水**：转账绝不转入任何个人账户或非金融机构公户。\n4. **守底仓**：无论如何，家庭必须保留一块雷打不动的“确定性安全资产”。\n5. **信常识**：天下没有免费的午餐，高收益必然伴随着高风险。\n"}, {"filename": "04_宏观与大类资产配置量化监测仪表盘.md", "title": "04 宏观与大类资产配置量化监测仪表盘", "path": "07_金融素养与核心词典馆/04_宏观与大类资产配置量化监测仪表盘.md", "content": "# 04 宏观与大类资产配置量化监测仪表盘\n\n> **定位**：搭建专业投资机构级别的宏观周期、资产性价比与流动性量化监测仪表盘体系，帮助投资者在复杂的经济迷雾中建立客观、理性的量化雷达。\n\n---\n\n## 🎛️ 宏观与大类资产配置核心监测维度\n\n```\n                           【资产配置量化监测仪表盘】\n                                       │\n     ┌──────────────────┬──────────────┼──────────────┬──────────────────┐\n     ▼                  ▼              ▼              ▼                  ▼\n【一、流动性与信用】 【二、大类资产性价比】 【三、通胀与经济动能】 【四、市场情绪风控】 【五、资产配置执行】\n ├─ M1/M2剪刀差      ├─ 股债利差 (ERP)   ├─ 官方与财新PMI     ├─ 股指期权波动率   ├─ 股债 50/50 动态\n ├─ 社融存量同比增速 ├─ 股息率 vs 国债   ├─ CPI / PPI 剪刀差 ├─ 融资融券余额占市值 ├─ 金字塔式定投加仓\n ├─ 银行间拆借Shibor ├─ 30Y/10Y期限利差  ├─ 原油/铜/黄金比价 ├─ 全市场破净股票比例 ├─ 终身年金压舱底仓\n └─ 离岸人民币汇率   └─ 席勒CAPE估值分位 └─ 发电量/货运克强指数└─ 新发基金份额极值 └─ 跨地域多币种对冲\n```\n\n---\n\n## 📈 核心指标一览与数据监测标准\n\n| 监测模块 | 关键量化指标 | 数据源 / 发布周期 | 周期拐点判定法则 |\n| :--- | :--- | :--- | :--- |\n| **流动性大盘** | **M1-M2 增速差** | 央行每月金融统计数据 | 连续 3 个月负值收窄，预示实体经济活化、A股估值中枢开始回升。 |\n| **信贷扩张** | **新增社融与信贷结构** | 央行每月数据 | 中长期企业贷款与居民中长期贷款占比提升，代表真实资本开支扩张。 |\n| **估值极值** | **股债收益差 (ERP)** | 交易所/中债估值 | ERP 达到近 10 年 90% 以上分位数时，买入宽基指数持有 3 年胜率接近 100%。 |\n| **微观体感** | **克强指数 (货运+耗电+贷款)** | 统计局/国家电网 | 消除统计平滑扰动，真实反应工业实体开工率。 |\n| **风险溢价** | **AA+城投 vs 国开利差** | 银行间债券市场 | 利差迅速走阔预示信用违约风险上升，应收紧信用债资质。 |\n\n---\n\n## 💡 实战落地：三步构建家庭资产负债表监测卡\n\n1. **每月初记录 3 大宏观指标**：10年期国债收益率、M1-M2剪刀差、沪深300 PE分位数；\n2. **每半年审视 1 次资产比例**：检查权益类资产（标普500/沪深300）与安全确定性资产（养老年金/增额寿/国债）是否偏离目标比例 $\\pm 5\\%$；\n3. **触及阈值无脑执行再平衡**：严格执行“高估止盈、低估补仓”，拒绝情绪化追涨杀跌。\n"}]}, {"info": {"id": "p8", "name": "08 ima 知识库直连与工具馆", "shortName": "ima云端", "dir": "08_ima知识库直连与工具馆", "icon": "fa-solid fa-cloud", "emoji": "☁️", "color": "teal", "desc": "腾讯 ima OpenAPI 接口配置、ima_finance_hub.py 混合双向智能检索引擎与工具操作"}, "docs": [{"filename": "01_ima知识库使用与同步配置指南.md", "title": "01 ima 知识库使用与同步配置指南", "path": "08_ima知识库直连与工具馆/01_ima知识库使用与同步配置指南.md", "content": "# 01 ima 知识库使用与同步配置指南\n\n## 1. 腾讯 ima 知识库 OpenAPI 概述\n\n腾讯 ima 知识库是腾讯推出的大模型知识库与智能工作台。通过 OpenAPI，可实现本地金融资产、专家方法论、培训资料与云端智能知识库的双向打通：\n- **Base URL**: \\`https://ima.qq.com/openapi/wiki/v1\\`\n- **认证方式**: HTTP Header 携带 \\`ima-openapi-clientid\\` 与 \\`ima-openapi-apikey\\`。\n\n---\n\n## 2. 配置文件结构 (config.json)\n\n在金融图书馆根目录或 \\`D:\\Hermes输出\\ima接入\\config.json\\` 中维护凭证：\n\n```json\n{\n  \"client_id\": \"3a93bc1ccc5f54d6b1103a0ba4824f6f\",\n  \"api_key\": \"fUIfBMuEGBIB8/DtJjxo2kj6Nj164RnWCMMpbuZqTdn4MlTIJc3S3T4vy9yrOkBf6+uCXYeKsw==\",\n  \"kb_id\": \"gy0q242S12_lBTcUH4QADLEnE2GcM-JKps7Jv5cg75g=\"\n}\n```\n\n- **已连接的两个云端知识库**：\n  1. \\`Andre的知识库\\` (\\`yu8CTx613whu49MQioSMN8ODW0nmMtGsmm23qs0YS2A=\\`)\n  2. \\`ins-knowledge base\\` (\\`gy0q242S12_lBTcUH4QADLEnE2GcM-JKps7Jv5cg75g=\\`)\n"}, {"filename": "02_本地与ima云端混合双向检索实战.md", "title": "02 本地与ima云端混合双向检索实战", "path": "08_ima知识库直连与工具馆/02_本地与ima云端混合双向检索实战.md", "content": "# 02 本地与ima云端混合双向检索实战\n\n## 1. 联合检索工具 \\`ima_finance_hub.py\\` 核心功能\n\n金融图书馆内置了专用的 Python 检索工具 \\`ima_finance_hub.py\\`，实现本地 Markdown 智库与腾讯云端 ima 知识库的秒级统一检索。\n\n### 常用命令示范：\n```powershell\n# 1. 列出当前账号下所有可用的云端 ima 知识库\npython D:\\Antigravity输出\\金融图书馆\\ima_finance_hub.py list\n\n# 2. 全库联合检索（本地金融图书馆 + 腾讯云端 ima 知识库）\npython D:\\Antigravity输出\\金融图书馆\\ima_finance_hub.py search 家族信托\npython D:\\Antigravity输出\\金融图书馆\\ima_finance_hub.py search 沪深300\npython D:\\Antigravity输出\\金融图书馆\\ima_finance_hub.py search 杨笑\npython D:\\Antigravity输出\\金融图书馆\\ima_finance_hub.py search 美林时钟\n```\n"}]}, {"info": {"id": "p9", "name": "09 顾问进阶与经典书单馆", "shortName": "书单进阶", "dir": "09_顾问进阶与经典书单馆", "icon": "fa-solid fa-book-open-reader", "emoji": "🎓", "color": "sky", "desc": "六维能力模型全景图、15本必读经典神作精粹（格雷厄姆/达里奥/辜朝明/芒格）、高客心理学、保单检视SOP、认知跃迁"}, "docs": [{"filename": "01_顶尖保险金融顾问六维能力模型与知识全景图.md", "title": "01 顶尖保险金融顾问六维能力模型与知识全景图", "path": "09_顾问进阶与经典书单馆/01_顶尖保险金融顾问六维能力模型与知识全景图.md", "content": "# 01 顶尖保险金融顾问六维能力模型与知识全景图\n\n> **导言**：传统保险代理人依赖“人情推销、产品说明会与话术套路”，而新时代的**顶尖保险金融顾问（Private Wealth & Insurance Advisor）**则是集“宏观经济洞察、大类资产配置、精算底层穿透、法商财富保护、医养康养生态与高客心理对话”于一身的**复合型财富架构师**。\n\n---\n\n## 🏛️ 顶尖顾问六维核心能力雷达图\n\n```\n                           【顶尖保险金融顾问能力六边形】\n                               宏观与周期洞察 (Macro)\n                                      /                                     /                 大类资产配置 (Asset) /    \\ 法商与家企隔离 (Legal & Tax)\n                                   /                                        /                  精算年金穿透 (Actuarial) \\        / 家族信托与家办 (Trust & FO)\n                                    \\      /\n                                     \\    /\n                                      \\/\n                               高客心理与KYC (Psychology)\n```\n\n---\n\n## 一、六维能力要素与实战段位进阶标准\n\n| 能力维度 | 初级代理人（产品推销级） | 资深理财经理（资产配置级） | 顶尖家办财富架构师（顶层设计级） |\n| :--- | :--- | :--- | :--- |\n| **1. 宏观与周期** | 只看保单收益率，背诵收益卖点。 | 能讲通降息降准、M2增速与无风险利率下行趋势。 | 深度解析**资产负债表衰退、中美利率平价、日本失落三十年对照与货币政策传导**。 |\n| **2. 投资与配置** | 贬低股票基金，片面强调保险最好。 | 能用标准普尔象限与马科维茨理论解释分散投资。 | 融汇 **JL Collins 极简指数定投 + 双账户确定性现金流**，帮客户构建攻守兼备的全天候资产包。 |\n| **3. 精算与产品** | 只看演示表最高档收益，不懂底层逻辑。 | 熟练计算保单 IRR/XIRR，区分主险与附加险。 | **穿透精算三差（死差/利差/费差）、分红实现率准备金平滑机制**，拆解组合销售对客户的精算利益。 |\n| **4. 法商与税务** | 简单说“保险能避税避债”（容易误导违法）。 | 熟练运用民法典婚姻篇、继承篇进行保单架构设计。 | 深度掌握**金税四期公转私穿透、法人人格否认判例、CRS 穿透实质以及合法合规家企债务防火墙**。 |\n| **5. 信托与家办** | 认为信托是几千万高客的事，与己无关。 | 熟练落地保险金信托 1.0/2.0 模式。 | 运用**平安“六境”哲学 + 三师共诊金三角**，量身定制家族宪章、多代信托分配条款与医养专属权益。 |\n| **6. KYC 与心理** | 急于推销产品，遇到异议强行辩驳。 | 能进行基础财务问卷调研，收集资产信息。 | 运用**杨笑深度问诊法、罗巍启发式发问、赵博叙事共情**，直击客户内心最深处的财富焦虑与软肋。 |\n\n---\n\n## 二、保险金融顾问的日常展业“四大底层底层思维”\n\n1. **从“卖产品”升级为“卖解决方案”**：\n   - 客户买的不是一份冰冷的合同，而是“未来的确定性现金流”、“子女婚姻的防守盾牌”与“晚年有尊严的医养居所”。\n2. **“先诊断、后开方”的医生思维（三师共诊）**：\n   - 绝不一上来就掏计划书；先通过深度 KYC 摸清客户家庭谱系、企业股权、负债担保、税务痛点，再出具全景诊断报告。\n3. **“晴天修屋顶”的法商防守思维**：\n   - 在企业盈利最好、家庭和睦、无债务纠纷的“晴天”，合法合规建立不可侵犯的家庭资产安全池。\n4. **终身陪伴的买方顾问思维**：\n   - 超越单次保单佣金，做客户家族两代人甚至三代人信赖的家庭财富管家。\n"}, {"filename": "02_保险金融顾问必读经典书单与核心精粹(宏观_投资_精算_法商_心理学).md", "title": "02 保险金融顾问必读经典书单与核心精粹", "path": "09_顾问进阶与经典书单馆/02_保险金融顾问必读经典书单与核心精粹(宏观_投资_精算_法商_心理学).md", "content": "# 02 保险金融顾问必读经典书单与核心精粹\n\n> **导言**：顶尖顾问的专业底蕴来源于跨学科的经典阅读积淀。精选宏观经济学、现代投资学、法商财富传承、精算原理与行为心理学等 **五大领域 15 部殿堂级经典著作**，提炼每本书的核心精髓与展业转化金句。\n\n---\n\n## 📚 顶尖金融顾问 15 本必读神作图谱\n\n```\n                          【保险金融顾问必读书架】\n                                     │\n   ┌─────────────────┬───────────────┼───────────────┬─────────────────┐\n   ▼                 ▼               ▼               ▼                 ▼\n【一、投资与哲学】   【二、宏观与周期】 【三、资产配置实战】 【四、法商与传承】 【五、心理学与对话】\n ├─《简单致富》       ├─《大衰退》       ├─《不落俗套的成功》 ├─《民法典婚姻编》 ├─《影响力》\n ├─《聪明的投资者》   ├─《债务危机》     ├─《全天候资产配置》 ├─《信托法精要》   ├─《思考，快与慢》\n └─《穷查理宝典》     └─《周期》         └─《漫步华尔街》     └─《中国家族信托》 └─《关键对话》\n```\n\n---\n\n## 一、投资哲学与财富极简主义\n\n### 1. 《简单致富》(The Simple Path to Wealth) —— JL Collins\n- **核心思想**：财富积累不需要复杂的金融衍生品。只要做到：**量入为出 + 零高息债务 + 将结余长期定投全市场低费率宽基指数基金（VTSAX/标普500/沪深300）+ 坚决不看盘不割肉**，就能轻松实现 F-You Money 与财务自由。\n- **展业金句**：*“复杂是金融中介赚钱的工具，而简单才是投资人致富的王道。我们用宽基指数分享人类实体经济繁荣，用终身年金锁定不可剥夺的晚年底牌。”*\n\n### 2. 《聪明的投资者》(The Intelligent Investor) —— 本杰明·格雷厄姆\n- **核心思想**：区分“投资”与“投机”；引入“市场先生 (Mr. Market)”概念；确立“安全边际 (Margin of Safety)”为投资的第一法则。\n- **展业金句**：*“市场先生每天都在报出荒谬的价格，聪明的投资者利用市场先生的愚蠢，而不是受其情绪左右。保险就是家庭资产负债表中最坚固的安全边际。”*\n\n### 3. 《穷查理宝典》(Poor Charlie's Almanack) —— 查理·芒格\n- **核心思想**：多元思维模型（物理、生物、工程、心理、数学交叉验证）；反过来想，总是反过来想（Invert, always invert）；避免愚蠢比争取聪明更容易。\n- **展业金句**：*“如果我知道我将来会死在哪里，那我永远都不会去那个地方。财富管理的第一步，不是算未来能赚多少倍，而是彻底封死可能让家庭破产的几大漏洞。”*\n\n---\n\n## 二、宏观经济、周期与大衰退研究\n\n### 4. 《大衰退：金融危机及日本失落三十年的启示》 —— 辜朝明 (Richard Koo)\n- **核心思想**：提出**“资产负债表衰退”**理论。当资产泡沫破灭（房价/股价暴跌），负债依然刚性存在，企业和家庭的目标从“利润最大化”转变为“负债最小化”，全力还债，导致货币政策失效（流动性陷阱）。\n- **展业金句**：*“在资产负债表修复期，借钱投资是危险的，持有现金流才是国王。终身养老年金是不随经济周期波动、按月持续注血的超级现金奶牛。”*\n\n### 5. 《债务危机》(Big Debt Crises) —— 瑞·达里奥 (Ray Dalio)\n- **核心思想**：剖析短期债务周期（5-8年）与长期债务周期（50-75年）；解释“和谐的去杠杆”如何通过紧缩、债务违约重组、财富转移和货币印钞四种工具协同达成。\n- **展业金句**：*“经济就像一台简单的机器，所有周期的本质都是借债与还债的交替。看清债务大周期，才能在高位守住财富。”*\n\n### 6. 《周期》(Mastering the Market Cycle) —— 霍华德·马克斯 (Howard Marks)\n- **核心思想**：周期永远不会消亡；钟摆法则（在极度贪婪与极度恐惧之间摆动）；卓越投资者的任务是识别当前钟摆处于周期的什么位置。\n- **展业金句**：*“树不可能长到天上去，高潮之后必有退潮。在市场狂热时储备安全资产，在市场冰封时拥有源源不断的现金流筹码。”*\n\n---\n\n## 三、资产配置与投资组合经典\n\n### 7. 《不落俗套的成功：个人投资的根本方法》 —— 大卫·斯文森 (David Swensen)\n- **核心思想**：耶鲁捐赠基金掌门人经典。资产配置决定了投资组合 90% 以上的收益变动；必须由核心资产类别构成（股票、债券、房地产、现金）；严守再平衡纪律。\n\n### 8. 《漫步华尔街》(A Random Walk Down Wall Street) —— 伯顿·马尔基尔 (Burton Malkiel)\n- **核心思想**：有效市场假说（EMH）；绝大多数主动基金经理长期无法战胜指数；买入并持有低成本宽基指数是个人投资者的最优解。\n\n---\n\n## 四、法商智慧与财富传承经典\n\n### 9. 《中华人民共和国民法典（婚姻家庭编与继承编精解）》 —— 最高人民法院民一庭\n- **核心精髓**：婚前财产婚后混同认定规则、父母为子女出资购房性质判定、转继承与代位继承、遗嘱效力排序、指定受益人对抗法定继承的绝对法律效力。\n\n### 10. 《中国家族信托实务与判例精解》\n- **核心精髓**：信托财产登记缺失下的实务操作、夫妻共同财产设立信托的效力边界、保单入信托（保险金信托）权属变更合规性、家族宪章法律约束力。\n\n---\n\n## 五、行为金融学、心理学与沟通\n\n### 11. 《思考，快与慢》(Thinking, Fast and Slow) —— 丹尼尔·卡尼曼\n- **核心思想**：系统1（直觉、快思考、情绪化）与系统2（理性、慢思考、深逻辑）；损失厌恶（亏损100元的痛苦远大于赚100元的快乐）；框架效应。\n- **展业转化**：高客对资产损失具有极度敏感的“损失厌恶”，讲“守住财富防流失”比讲“多赚2%收益”更能打动高净值客户。\n\n### 12. 《影响力》(Influence: The Psychology of Persuasion) —— 罗伯特·西奥迪尼\n- **核心思想**：六大说服力心理武器：互惠、承诺一致、社会认同、喜好、权威、稀缺。\n\n### 13. 《关键对话》(Crucial Conversations) —— 凯里·帕特森等\n- **核心思想**：当赌注巨大、意见相左、情绪激烈时，如何营造安全氛围，实现共享观点库。\n"}, {"filename": "03_高净值客户心理学与信任建立的底层逻辑.md", "title": "03 高净值客户心理学与信任建立的底层逻辑", "path": "09_顾问进阶与经典书单馆/03_高净值客户心理学与信任建立的底层逻辑.md", "content": "# 03 高净值客户心理学与信任建立的底层逻辑\n\n> **导言**：超高净值客户（企业家、创一代、金领高管）阅人无数、防备心极强。他们对普通的产品推销具有天然的“免疫力与排斥感”。本篇文献深度拆解高客底层心理画像，提炼“破冰、共情、立威、共谋”的高客信任建立法则。\n\n---\n\n## 🧠 高净值客户的四大底层心理特征\n\n```\n                             【高净值客户心理画像】\n                                       │\n     ┌──────────────────┬──────────────┼──────────────┬──────────────────┐\n     ▼                  ▼              ▼              ▼                  ▼\n【一、极度匮乏安全感】 【二、极度渴望控制权】 【三、对低效推销零容忍】 【四、隐秘而深沉的牵挂】\n • 担心政策风向变动   • 习惯掌控企业一切   • 时间机会成本极高   • 子女婚姻是否靠谱\n • 担心企业担保爆雷   • 资产不愿轻易脱手   • 厌恶虚伪套路话术   • 二代接班能力欠缺\n • 担心金税四期穿透   • 信托条款要求话语权 • 唯有专业对等才倾听 • 老人尊严与高品质医疗\n```\n\n---\n\n## 一、高客沟通的“三大致命误区” vs “顶级展业心法”\n\n| 传统销售误区 | 顶级顾问心法 | 实战对比话术 |\n| :--- | :--- | :--- |\n| ❌ **炫耀收益**：“我们这款产品收益率高达 X%，比银行划算多了！” | ✅ **关注安全底牌**：“张总，像您这样成功的企业家，企业是您的印钞机，您根本不缺赚钱的门路。您最需要的是一个哪怕企业发生翻天覆地变化，也绝对不会被债权人拿走的**家庭安全地窖**。” | 转移焦点：从“收益比拼”切换到“安全护城河”。 |\n| ❌ **急于推产品**：坐下5分钟就掏出手机看计划书。 | ✅ **深度调研问诊**：“李总，今天我们不谈任何产品。我主要想帮您梳理一下，在民法典新规和金税四期背景下，您目前的股权和家庭资产架构是否存在法律盲区。” | 建立专家权威：以咨询顾问身份出场。 |\n| ❌ **被动应付异议**：“客户说‘收益太低’，手足无措开始辩解。” | ✅ **同频反问共情（罗巍/杨笑）**：“王总，我非常理解您。如果单纯看收益率，保险确实跑不赢您的实业生意。但请问您，如果发生极端风浪，实业和股票能保证100%按月给您和孩子打钱吗？” | 升维打击：区分“进攻资金”与“防守现金流”。 |\n\n---\n\n## 二、建立深度信任的“黄金四步法” (Trust Building Framework)\n\n1. **第一步：同频破冰（寻找共同价值锚）**：\n   - 关注企业家的创业艰辛与行业大势，用宏观周期、行业政策作为切入点，不谈保险；\n2. **第二步：法商体检（展示专业刺痛盲区）**：\n   - 通过 1-2 个极具冲击力的真实司法判例（如张兰信托击穿案、婚前房产婚后贬值混同分割案），引发客户对自身架构的警惕；\n3. **第三步：三师出具方案（团队化赋能）**：\n   - 强调“三师共诊 + 高家帮”专业团队，让律师和税务专家为方案背书，消除对单一销售人员的不信任；\n4. **第四步：终身利他交付（超越保单的生态连接）**：\n   - 联动平安医养生态（名医就医通、私董保健医、居家养老改造），解决高客家人当下最紧迫的健康与照护痛点。\n"}, {"filename": "04_保单检视与家庭全景财务体检实操SOP.md", "title": "04 保单检视与家庭全景财务体检实操SOP", "path": "09_顾问进阶与经典书单馆/04_保单检视与家庭全景财务体检实操SOP.md", "content": "# 04 保单检视与家庭全景财务体检实操SOP\n\n> **导言**：保单检视（Policy Audit）是连接老客户、切入高客存量资产、挖掘千万级保额缺口最有效、最专业的展业抓手。标准化保单检视不是找茬挑刺，而是站在客户家庭全局视角，排查**“保障漏洞、法律权属隐患、现金流断流风险与代际传承阻碍”**。\n\n---\n\n## 📋 保单检视“七步标准化作业流程” (SOP)\n\n```\n【专业保单检视七步闭环】\n\n [1. 收集整理] ──➔ [2. 梳理保单图谱] ──➔ [3. 六维风险排查] ──➔ [4. 绘制现金流沙盘]\n    (保单拍照/APP)    (投/被/受益人关系)    (权属/缺口/断缴)     (生存金/分红/年金)\n                                                                       │\n [7. 动态跟踪] ◀── [6. 出具优化建议] ◀── [5. 编制全景体检报告] ◀──────┘\n    (每年检视更新)     (加保/信托/受益人变更)   (深蓝橙色视觉化报告)\n```\n\n---\n\n## 一、保单检视的核心排查清单（Checklist）\n\n### 1. 法律权属与投保人风险排查\n- [ ] **投保人是否负债/涉诉**：若投保人（如企业主）背负巨额担保，保单现金价值可能被法院强制执行！建议将投保人变更为无债务风险的直系亲属或置入保险金信托 2.0。\n- [ ] **是否已指定身故受益人**：严查受益人栏是否写着“法定”！若为法定，直接沦为遗产，面临繁琐继承公证、债务清偿与亲属继承纠纷。\n- [ ] **受益人顺位与份额是否明确**：是否需要设立第二、第三顺位受益人，或按比例分配。\n\n### 2. 现金流与保障缺口排查\n- [ ] **退休后确定现金流是否充足**：测算 60 岁以后的保证领取年金总额，是否能维持现有生活品质的 70% 养老金替代率。\n- [ ] **重疾与医疗保额是否缩水**：早期购买的 10 万/20 万重疾险在当下高昂医疗通胀下严重不足，需补充百万医疗与特药保障。\n- [ ] **交费期与断缴风险**：梳理各张保单扣款账户与交费截止日，防止因银行卡限额或疏忽导致保单失效。\n\n---\n\n## 二、输出交付件：《家庭全景保单与财富体检报告书》范本结构\n\n1. **家庭保单总资产一览表**（年交总保费、累计现金价值、总身故保额）；\n2. **家庭成员保障覆盖雷达图**（寿险、重疾、医疗、意外、年金五维打分）；\n3. **家庭终身确定现金流流入时序图**（按年度生成 0-100 岁现金流柱状图）；\n4. **潜在法律与税务风险诊断清单**（红色高危、黄色预警、绿色正常）；\n5. **专业优化与提升配置建议**（受益人变更指引、保险金信托对接方案、年金补充测算）。\n"}, {"filename": "05_从产品销售到财富架构师的认知跃迁之路.md", "title": "05 从产品销售到财富架构师的认知跃迁之路", "path": "09_顾问进阶与经典书单馆/05_从产品销售到财富架构师的认知跃迁之路.md", "content": "# 05 从产品销售到财富架构师的认知跃迁之路\n\n> **导言**：保险代理人的天花板不在于勤奋程度，而在于**认知模型与身份定位**。从“保单销售员”跃迁为“财富架构师”，本质上是思维逻辑、知识框架与价值创造方式的彻底重构。\n\n---\n\n## 🚀 认知跃迁的三重境界\n\n```\n【顾问职业生命周期的三重跃迁】\n\n  第一重：【产品销售员】 (Product Seller)\n  • 核心能力：熟背条款、销售技巧、促单逼单\n  • 客户认知：“买保险的推销员”，呼之即来挥之即去\n  • 竞争维度：拼返佣、拼感情、拼勤奋，极易被替代\n\n        │ 跃迁 1：掌握资产配置与财务规划\n        ▼\n  第二重：【理财规划师】 (Financial Planner)\n  • 核心能力：资产配置象限、双账户规划、IRR量化测算\n  • 客户认知：“懂理财的专业人员”，具备初步财务信任\n  • 竞争维度：拼专业度、拼工具模型、拼方案合理性\n\n        │ 跃迁 2：掌握法商架构、信托设计、家办生态与三师共诊\n        ▼\n  第三重：【家族财富架构师】 (Family Wealth Architect)\n  • 核心能力：家企隔离、信托顶层设计、医养生态对接、跨代传承治理\n  • 客户认知：“家族不可或缺的首席财富顾问与战略智囊”\n  • 竞争维度：高客信任壁垒极高，单笔千万级信托/年金保单自然成交！\n```\n\n---\n\n## 一、财富架构师必备的“四大支柱模型”\n\n1. **法律支柱**：熟练运用《民法典》、《信托法》、《公司法》，构建坚不可摧的资产隔离墙；\n2. **精算支柱**：深刻理解利率周期与保险精算，用确定性现金流平滑宏观波动；\n3. **税务支柱**：通晓金税四期、个税、企税、CRS 规则，确保资产代际传承阳光合规；\n4. **生态支柱**：整合平安集团“综合金融 + 医疗健康 + 居家养老”全牌照资源，为高客家族赋能。\n"}]}, {"info": {"id": "p10", "name": "10 高客实战案卷与全流程馆", "shortName": "实战案卷", "dir": "10_高客实战案卷与全流程馆", "icon": "fa-solid fa-folder-open", "emoji": "📂", "color": "amber", "desc": "真实高客案例卷宗：制造业主千万家企隔离、二代婚变防守信托、多子女公平传承、跨境电商CRS合规、高管千万年薪税筹"}, "docs": [{"filename": "01_制造业主千万级家企隔离与债务防火墙实战案卷.md", "title": "01 制造业主千万级家企隔离与债务防火墙实战案卷", "path": "10_高客实战案卷与全流程馆/01_制造业主千万级家企隔离与债务防火墙实战案卷.md", "content": "# 01 制造业主千万级家企隔离与债务防火墙实战案卷\n\n> **案件编号**：HWN-CASE-202601  \n> **客户画像**：某大型机械制造民营企业主陈总（52岁），企业年营收 1.5 亿元，背负银行经营性贷款 4000 万元，陈总夫妇承担无限连带个人保证责任。  \n> **核心痛点**：实业周期下行，利润微薄，极度担忧未来一旦企业资金链断裂，家庭名下数套豪宅与全部银行存款被银行查封，妻儿流落街头。\n\n---\n\n## ⚠️ 案情全景风险诊断\n\n```\n【陈总家庭资产风险暴露图】\n\n   [机械制造实业公司] ──(4000万银行贷款)──➔ [银行债权人]\n          │                                     │\n    (个人无限连带担保)                   (主张执行连带责任)\n          │                                     │\n          ▼                                     ▼\n     【陈总夫妇】 ──(名下直接持有)──➔ 【家庭名下4套房产 + 2000万存款】\n                                       ❌ 极度危险！一旦判决全部冻结！\n```\n\n---\n\n## 🛠️ 三师共诊破局解决方案（架构重组设计）\n\n1. **合法合规分红与资产剥离（在企业无逾期欠款的“晴天”执行）**：\n   - 依法缴纳 20% 利息股息红利个税后，从企业未分配利润中合规分红 1500 万元至陈太太个人账户；\n2. **设立不可撤销家庭安全现金流账户（大额增额终身寿 + 养老年金）**：\n   - **投保人**：陈太太（未在企业任职、未签署任何对外担保文件）；\n   - **被保人**：陈总（或陈总儿子）；\n   - **身故受益人**：儿子（指定顺位与份额）；\n   - 保费规模：年交 300 万，交 5 年，总投入 1500 万元。\n3. **进阶升级：设立保险金信托 2.0**：\n   - 保单交费期满后，将投保人与受益人变更为信托公司，彻底切断生前债务追索可能；\n   - 约定每月向陈总夫妇及儿子分配固定生活金 8 万元，设立大病特支金与孙辈教育金。\n\n---\n\n## 🎯 方案落地效果与客户获益\n\n- ✅ **实现绝对家企隔离**：依据民法典与信托法，该 1500 万信托资产独立于企业债务，即便未来企业破产，该笔现金流每月准时到账，全家生活品质不受任何影响；\n- ✅ **锁定终身确定复利**：年金与分红险终身锁定 3.0%+ 确定性增值，彻底摆脱实业周期的巨大波动。\n"}, {"filename": "02_二代婚变防守与隔代抚养保险金信托实战案卷.md", "title": "02 二代婚变防守与隔代抚养保险金信托实战案卷", "path": "10_高客实战案卷与全流程馆/02_二代婚变防守与隔代抚养保险金信托实战案卷.md", "content": "# 02 二代婚变防守与隔代抚养保险金信托实战案卷\n\n> **案件编号**：HWN-CASE-202602  \n> **客户画像**：某外贸集团董事长李女士（56岁），独生女（27岁）即将与相识不久的男友结婚，男方家境普通且在创业阶段。  \n> **核心痛点**：李女士准备给女儿 2000 万元嫁妆，但极度担忧：① 女儿婚后若发生婚变离婚，巨额嫁妆被女婿分走一半；② 女婿创业失败导致女儿名下财产被连带执行；③ 婚后家庭财产被挥霍。\n\n---\n\n## ⚠️ 法律风险深度剖析\n\n1. **直接转账赠与的巨大风险**：根据《民法典》第 1062 条，若李女士在女儿婚后直接将 2000 万转给女儿，若无明确书面财产约定，极易被认定为对夫妻双方的共同赠与，离婚时男方有权分走 1000 万！\n2. **直接买房登记在女儿名下的风险**：婚后买房即使只写女儿名字，若用婚后夫妻共同财产还贷或产生增值，增值部分与共同还贷部分仍属于夫妻共有。\n\n---\n\n## 🛠️ 三师共诊解决方案：“保单 + 家族信托”闭环防守\n\n```\n【二代婚姻财富防火墙架构】\n\n    【委托人：李女士 (母亲)】\n               │\n      (投入 2000 万元设立不可撤销家族信托)\n               │\n               ▼\n        【信托公司 (受托人)】\n               │\n       ┌───────┴──────────────────────────────┐\n       │ 投资底层：大额分红年金 (确定性增值)   │\n       └───────┬──────────────────────────────┘\n               │\n     【信托利益精准定向分配条款】\n     • 受益人：仅限女儿及未来出生的孙辈 (严格排除女婿)\n     • 分配规则：\n       - 每月给女儿分配生活金 5 万元 (明确依据民法典1063条为个人财产)\n       - 结婚满 5 年且未婚变奖励 100 万元\n       - 生育一胎给孙辈设立 200 万专属教育金 (直达孙辈，隔代传承)\n       - 若发生离婚诉讼，信托暂停分配，待婚变判决生效后恢复给付！\n```\n\n---\n\n## 🎯 方案落地效果与客户获益\n\n- ✅ **100% 隔离婚变分割风险**：信托利益与保单现金流受法律严格保护，女婿无论如何无法在离婚时主张分割一分钱；\n- ✅ **隔代精准关爱**：资金直接越过二代定向输入到第三代孙辈教育基金中，打破富不过三代魔咒。\n"}, {"filename": "03_高净值多子女公平传承与遗产争端化解案卷.md", "title": "03 高净值多子女公平传承与遗产争端化解案卷", "path": "10_高客实战案卷与全流程馆/03_高净值多子女公平传承与遗产争端化解案卷.md", "content": "# 03 高净值多子女公平传承与遗产争端化解案卷\n\n> **案件编号**：HWN-CASE-202603  \n> **客户画像**：某商业地产投资人王老先生（68岁），名下资产包括 2 栋商业楼宇（估值约 8000 万）及金融资产 3000 万元。有大儿子（参与企业经营）、二女儿（在海外定居）、小儿子（性格叛逆、开销无度）。  \n> **核心痛点**：不动产无法物理切分；担心百年后子女因遗产争端闹上法庭反目成仇；担心小儿子分到巨额财产后迅速被狐朋狗友挥霍败光。\n\n---\n\n## 🛠️ 三师共诊解决方案：“动静结合”综合传承方案\n\n1. **实业与不动产集中传承（确保经营稳定）**：\n   - 2 栋商业楼宇及公司控股股权由参与经营的大儿子全额继承，保持企业控制权统一；\n2. **金融资产对冲平衡（补偿二女儿与小儿子）**：\n   - 王老先生利用 3000 万元金融资产配置 **大额终身寿险与年金保险组合**，通过指定受益人方式实现公平现金补偿：\n     - **保单一（保额 2000 万）**：指定**二女儿**为唯一身故受益人，免公证、免纠纷，直接打入海外或境内合规账户；\n     - **保单二（保额 2000 万）+ 保险金信托**：指定**信托公司**为受益人，设立以**小儿子**为受益人的防挥霍信托，约定按月给付生活费 3 万元，杜绝一次性拿走巨款。\n\n---\n\n## 🎯 方案落地效果与客户获益\n\n- ✅ **实现“手心手背都是肉”的绝对公平**：大儿子得房产股权、女儿和小儿子各得 2000 万确定性现金补偿；\n- ✅ **彻底消除遗产诉讼风险**：指定受益人人寿保单不属于遗产，无需所有继承人到场公证签字，避免家庭决裂。\n"}, {"filename": "04_外贸跨境电商企业主CRS与跨币种资产配置案卷.md", "title": "04 外贸跨境电商企业主CRS与跨币种资产配置案卷", "path": "10_高客实战案卷与全流程馆/04_外贸跨境电商企业主CRS与跨币种资产配置案卷.md", "content": "# 04 外贸跨境电商企业主CRS与跨币种资产配置案卷\n\n> **案件编号**：HWN-CASE-202604  \n> **客户画像**：跨境电商大卖家赵总（42岁），在香港、新加坡拥有离岸贸易公司，个人境外账户结存美元资金超 500 万美元，在国内有家庭与多处房产。  \n> **核心痛点**：面临 CRS 涉税信息穿透回国（中国税法反避税新个税法第8条）、香港公司未分配利润税务合规压力，以及海外资金如何合法安全回流与保值增值。\n\n---\n\n## 🛠️ 解决方案：全球资产阳光化与多币种配置\n\n1. **离岸架构合规化梳理**：\n   - 梳理香港公司经济实质（Economic Substance），合法完成跨境转移定价与税务申报，避免被中国税局直接认定为受控外国企业（CFC）纳税；\n2. **境内外资产双核配置**：\n   - **离岸端（美元资产）**：配置香港顶级跨国保险公司多元货币储蓄分红保单 + 离岸信托，锁定 6-7 种国际主流货币自由转换，对冲单一币种汇率风险；\n   - **境内端（人民币压舱石）**：将合规回流资金配置国内顶级分红年金险（如倍佑福）+ 标普500/沪深300 QDII 指数定投，构筑不可动摇的人民币安全底座。\n"}, {"filename": "05_企业高管千万年薪个税合规与终身养老规划案卷.md", "title": "05 企业高管千万年薪个税合规与终身养老规划案卷", "path": "10_高客实战案卷与全流程馆/05_企业高管千万年薪个税合规与终身养老规划案卷.md", "content": "# 05 企业高管千万年薪个税合规与终身养老规划案卷\n\n> **案件编号**：HWN-CASE-202605  \n> **客户画像**：某科技上市公司高级副总裁孙总（48岁），税前年薪 600 万元，另有股票期权激励。  \n> **核心痛点**：个人所得税适用最高档 45% 边际税率，税负极重；高收入依赖个人在职状态，担心 55 岁退休后收入断崖式下跌，无法维持目前每年上百万的高品质生活消费。\n\n---\n\n## 🛠️ 解决方案：递延与终身养老现金流规划\n\n1. **合法税优与递延规划**：\n   - 用足个人养老金每年 12,000 元税前扣除额度；\n   - 优化年终奖与股权激励行权时间节点，利用年终奖单独计税政策平滑综合所得边际税率；\n2. **构建退休后“每年100万确定现金流”年金池**：\n   - 在当期收入顶峰期，每年投入 150 万元，连续投入 5 年（总计 750 万元）购买高确定性养老年金险；\n   - 设定从 55 岁起，每年固定给付养老金 **60 万元**，结合分红利益预计可达 **90-110 万元/年**，一直领到终身；\n   - 锁定平安高品质康养社区（臻颐年/颐年城）保证入住权与家庭就医绿色通道。\n\n---\n\n## 🎯 方案落地效果与客户获益\n\n- ✅ **完美化解“收入断崖危机”**：退居二线后，按月打卡的高额养老金自动替代工资收入，实现真正的“财务与人生自由”。\n"}]}];

    function renderDrawerList() {
      const list = document.getElementById('drawerList');
      list.innerHTML = DATA.map((item, idx) => `
        <button onclick="selectPavilion(${idx}); toggleMobileDrawer();"
                class="w-full text-left p-2.5 rounded-xl text-xs font-medium transition flex items-center space-x-3 text-slate-300 hover:bg-slate-800 active:bg-slate-800">
          <span class="text-base">${item.info.emoji}</span>
          <div class="min-w-0">
            <div class="font-bold text-white truncate text-xs">${item.info.name}</div>
            <div class="text-[10px] text-slate-400 truncate">${item.docs.length} 篇文献</div>
          </div>
        </button>
      `).join('');
    }

    function selectPavilion(idx) {
      currentPavilion = idx;
      
      DATA.forEach((_, i) => {
        const mTab = document.getElementById('m-tab-' + i);
        if (mTab) {
          if (i === idx) {
            mTab.className = 'flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-bold transition flex items-center space-x-1.5 text-amber-300 bg-amber-500/20 border border-amber-500/50 shadow-sm';
            mTab.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
          } else {
            mTab.className = 'flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-medium transition flex items-center space-x-1.5 text-slate-400 bg-slate-900/80 border border-slate-800';
          }
        }
        const dNav = document.getElementById('d-nav-' + i);
        if (dNav) {
          if (i === idx) {
            dNav.className = 'w-full text-left px-3 py-2 rounded-xl text-xs font-bold transition flex items-center space-x-2 text-amber-400 bg-amber-500/10 border border-amber-500/30';
          } else {
            dNav.className = 'w-full text-left px-3 py-2 rounded-xl text-xs font-medium transition flex items-center space-x-2 text-slate-400 hover:text-white hover:bg-slate-800/60';
          }
        }
        const bTab = document.getElementById('bottom-tab-' + i);
        if (bTab) {
          bTab.className = (i === idx) ? 'flex flex-col items-center space-y-1 text-amber-400 font-bold' : 'flex flex-col items-center space-y-1 text-slate-400';
        }
      });

      const item = DATA[idx];
      document.getElementById('bannerEmoji').innerText = item.info.emoji;
      document.getElementById('bannerBadge').innerText = item.info.shortName;
      document.getElementById('bannerTitle').innerText = item.info.name;
      document.getElementById('bannerDesc').innerText = item.info.desc;
      document.getElementById('bannerIconBig').innerText = item.info.emoji;

      renderDocs(item.docs);
    }

    function renderDocs(docs) {
      const grid = document.getElementById('docsGrid');
      if (!docs || docs.length === 0) {
        grid.innerHTML = `<div class="col-span-2 text-center py-12 text-slate-500 text-xs">未找到相关文献</div>`;
        return;
      }
      grid.innerHTML = docs.map(doc => `
        <div onclick="openDocByPath('${doc.path}')"
             class="group bg-slate-900/70 border border-slate-800/90 hover:border-amber-500/40 hover:bg-slate-900 rounded-2xl p-4 cursor-pointer transition duration-150 flex flex-col justify-between active:scale-[0.98]">
          <div class="space-y-2">
            <div class="flex items-center justify-between text-[11px] text-slate-500">
              <span class="font-mono bg-slate-950 px-2 py-0.5 rounded border border-slate-800 text-slate-400 text-[10px]">
                ${doc.filename}
              </span>
              <span class="text-amber-400 text-[11px] font-medium"><i class="fa-solid fa-arrow-right text-[10px]"></i> 阅读</span>
            </div>
            <h3 class="text-sm font-bold text-white group-hover:text-amber-300 transition line-clamp-2 leading-snug">
              ${doc.title}
            </h3>
            <p class="text-xs text-slate-400 line-clamp-2 leading-relaxed">
              ${doc.content.replace(/#+\s+/g, '').slice(0, 95)}...
            </p>
          </div>
          <div class="pt-3 mt-2 border-t border-slate-800/60 flex items-center justify-between text-[10px] text-slate-500">
            <span>📚 顶尖顾问研习文献</span>
            <span class="text-slate-400">点击进入沉浸阅读</span>
          </div>
        </div>
      `).join('');
    }

    function openDocByPath(path, saveHistory = true) {
      let found = null;
      const targetFilename = path.split('/').pop().split('#')[0];
      
      for (const p of DATA) {
        for (const d of p.docs) {
          if (d.path === path || d.filename === targetFilename || d.path.endsWith(targetFilename)) {
            found = d;
            break;
          }
        }
        if (found) break;
      }
      if (!found) {
        showToast('未找到对应文献：' + targetFilename);
        return;
      }

      if (saveHistory && currentDoc && currentDoc.path !== found.path) {
        historyStack.push(currentDoc.path);
        updateHistoryBtn();
      }

      currentDoc = found;
      document.getElementById('readerFooterPath').innerText = '归档路径：' + found.path;
      document.getElementById('readerBody').innerHTML = marked.parse(found.content);
      document.getElementById('readerScroll').scrollTop = 0;
      document.getElementById('readProgress').style.width = '0%';
      document.getElementById('readerModal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function goBackDoc() {
      if (historyStack.length > 0) {
        const prevPath = historyStack.pop();
        updateHistoryBtn();
        openDocByPath(prevPath, false);
      }
    }

    function updateHistoryBtn() {
      const btn = document.getElementById('historyBackBtn');
      if (historyStack.length > 0) {
        btn.classList.remove('hidden');
        btn.classList.add('flex');
        const prevPath = historyStack[historyStack.length - 1];
        const prevName = prevPath.split('/').pop().replace(/^[0-9]+_/, '').replace('.md', '');
        document.getElementById('historyBackLabel').innerText = prevName.slice(0, 5) + '...';
      } else {
        btn.classList.add('hidden');
        btn.classList.remove('flex');
      }
    }

    function closeReader() {
      document.getElementById('readerModal').classList.add('hidden');
      document.body.style.overflow = '';
      historyStack.length = 0;
      updateHistoryBtn();
    }

    /* 超链接拦截器 */
    function setupLinkInterceptor() {
      document.getElementById('readerBody').addEventListener('click', function(e) {
        const link = e.target.closest('a');
        if (!link) return;
        const href = link.getAttribute('href');
        if (!href) return;

        if (href.startsWith('http://') || href.startsWith('https://')) {
          link.setAttribute('target', '_blank');
          link.setAttribute('rel', 'noopener noreferrer');
          return;
        }

        if (href.endsWith('.md') || href.includes('.md') || !href.startsWith('#')) {
          e.preventDefault();
          let cleanHref = decodeURIComponent(href).replace(/^\.\.\//, '').replace(/^\.\//, '');
          openDocByPath(cleanHref, true);
        }
      });
    }

    function updateProgress() {
      const el = document.getElementById('readerScroll');
      const total = el.scrollHeight - el.clientHeight;
      if (total > 0) {
        const p = (el.scrollTop / total) * 100;
        document.getElementById('readProgress').style.width = p + '%';
      }
    }

    function adjustFontSize(delta) {
      baseFontSize = Math.max(12, Math.min(24, baseFontSize + delta));
      document.getElementById('readerBody').style.fontSize = baseFontSize + 'px';
      showToast('字体大小：' + baseFontSize + 'px');
    }

    function copyArticle() {
      if (!currentDoc) return;
      navigator.clipboard.writeText(currentDoc.content).then(() => {
        showToast('文章 Markdown 已复制到剪贴板！');
      });
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = msg;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 1800);
    }

    function toggleMobileDrawer() {
      const d = document.getElementById('mobileDrawer');
      d.classList.toggle('hidden');
    }

    function focusSearch() {
      const inp = document.getElementById('mobileSearchInput');
      inp.focus();
      inp.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function clearSearch() {
      document.getElementById('mobileSearchInput').value = '';
      document.getElementById('desktopSearchInput').value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      selectPavilion(currentPavilion);
    }

    function bindSearch() {
      const handler = (e) => {
        const q = e.target.value.trim().toLowerCase();
        const clearBtn = document.getElementById('clearSearchBtn');
        if (q) {
          clearBtn.classList.remove('hidden');
          const matched = [];
          DATA.forEach(p => {
            p.docs.forEach(d => {
              if (d.title.toLowerCase().includes(q) || d.content.toLowerCase().includes(q) || d.filename.toLowerCase().includes(q)) {
                matched.push(d);
              }
            });
          });
          document.getElementById('bannerEmoji').innerText = '🔍';
          document.getElementById('bannerBadge').innerText = '全库检索';
          document.getElementById('bannerTitle').innerText = `搜索结果: "${q}"`;
          document.getElementById('bannerDesc').innerText = `在金融图书馆全库中为您精准命中 ${matched.length} 篇文献、案卷与书单`;
          renderDocs(matched);
        } else {
          clearBtn.classList.add('hidden');
          selectPavilion(currentPavilion);
        }
      };
      document.getElementById('mobileSearchInput').addEventListener('input', handler);
      document.getElementById('desktopSearchInput').addEventListener('input', handler);
    }

    window.onload = init;
  </script>
</body>
</html>
